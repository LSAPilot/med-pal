[project]
name = "regulatory-helper"
version = "0.1.0"
description = "RAG system for regulatory questions about medical device software (MDR, GDPR, AI Act)"
requires-python = ">=3.10"
dependencies = [
    "lxml>=6.1.3",
]

[project.scripts]
regulatory-helper = "regulatory_helper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
