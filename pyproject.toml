[project]
name = "regulatory-helper"
version = "0.1.0"
description = "RAG system for regulatory questions about medical device software (MDR, GDPR, AI Act)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0",
    "lxml>=6.1.3",
    "numpy>=2.2.6",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "torch>=2.4",
]

[project.scripts]
regulatory-helper = "regulatory_helper.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=8",
]
# UI only: the Space gets gradio through its `sdk_version`, so this group is not exported to requirements.txt
app = ["gradio==6.31.0"]

[tool.uv]
default-groups = ["dev", "app"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
